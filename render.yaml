
services:
  - type: web
    name: collaborative-docs-app
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0
    envVars:
      - key: DOCUMENTS_FILE
        value: /var/data/documents.json
    disk:
      name: documents-data
      mountPath: /var/data
      sizeGB: 1
